name: Publish Pair of Dice Design

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ace-studio.html'
      - 'assets/welcome/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare static publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css builder.html ace-studio.html robot-explorer.js _site/
          cp .nojekyll _site/
          for file in site.json navigation.json robots.json sponsors.json settings.json; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          for directory in assets content models binders; do
            if [ -d "$directory" ]; then cp -a "$directory" _site/; fi
          done
          echo "Published assets:"
          du -sh _site
          test -f _site/index.html
          test -f _site/models/catalog.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
