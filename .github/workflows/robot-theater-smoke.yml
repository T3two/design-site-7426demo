name: Robot theater browser smoke test
on:
  push:
    paths:
      - 'robot-explorer.js'
      - 'robot-workbench-2.js'
      - 'tests/workbench2-smoke.cjs'
      - 'index.html'
      - 'styles.css'
      - 'assets/welcome/**'
      - 'tests/welcome-startup-smoke.cjs'
      - 'tests/fast-robot-preview.cjs'
      - 'tests/ace-comic-3d.cjs'
      - 'tests/ace-original-joints-studio.cjs'
      - 'tests/robot-interactions-smoke.cjs'
      - 'tests/robot-theater-smoke.cjs'
      - '.github/workflows/robot-theater-smoke.yml'
  workflow_dispatch:

# Never run several expensive SwiftShader robot tests on the same review ref.
concurrency:
  group: robot-theater-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Validate workbench JavaScript syntax
        run: |
          node --check robot-explorer.js
          node --input-type=module --check < robot-workbench-2.js
      - name: Run static site server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/robot-http.log 2>&1 &
          sleep 3
      - name: Verify instant welcome paint (desktop and mobile)
        run: node tests/welcome-startup-smoke.cjs
      - name: Verify comic-styled 3D Ace actually renders
        run: node tests/ace-comic-3d.cjs
      - name: Verify original Ace joint animation Studio
        run: node tests/ace-original-joints-studio.cjs
      - name: Verify fast 2025 and 2026 CAD models
        run: node tests/fast-robot-preview.cjs
      - name: Verify cached subsystem transitions and CAD part inspection
        run: node tests/robot-interactions-smoke.cjs
      - name: Verify Workbench 2.0 assembly, measurements, section tools and history
        run: node tests/workbench2-smoke.cjs
      - name: Exercise both 3D scoring sequences in Chromium
        run: node tests/robot-theater-smoke.cjs
      - name: Attach screenshots and browser errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-theater-browser-check
          path: test-results/
          if-no-files-found: ignore
