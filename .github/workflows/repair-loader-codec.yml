name: Repair red loader video codec
on:
  push:
    paths:
      - ".github/workflows/repair-loader-codec.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert loader video to browser-compatible H.264
        shell: bash
        run: |
          set -euo pipefail
          src="assets/loading/pair-of-dice-original-red-outline.mp4"
          test -s "$src"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -an -c:v libx264 -profile:v baseline -level 3.1 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart "/tmp/loader-h264.mp4"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/loader-h264.mp4)"
          test "$codec" = "h264"
          mv "/tmp/loader-h264.mp4" "$src"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$src"
          if ! git diff --cached --quiet; then
            git commit -m "Fix loading MP4 H.264 codec for browser playback"
            git push
          fi
